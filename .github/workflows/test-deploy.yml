name: Test Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get current date and time
        id: datetime
        run: echo "now=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Get UNIX timestamp
        id: unixtime
        run: echo "now=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Get actor uppercase
        id: actor
        run: echo "name=$(echo $GITHUB_ACTOR | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Get merged from (if PR)
        id: prinfo
        run: |
          if [ ! -z "$GITHUB_EVENT_PULL_REQUEST_NUMBER" ]; then
            echo "merged=' (merged from $(jq -r .pull_request.user.login < $GITHUB_EVENT_PATH | tr '[:lower:]' '[:upper:]'))'"
          else
            echo "merged=''"
          fi
          echo "merged=$merged" >> $GITHUB_OUTPUT

      - name: Slack Notification - Start
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "Deployment started on AZURE TEST SERVER\nRUN BY: *${{ steps.actor.outputs.name }}*${{ steps.prinfo.outputs.merged }}\nTIME: <!date^${{ steps.unixtime.outputs.now }}^{date_num} {time_secs}|${{ steps.unixtime.outputs.now }}>"
            }

      - name: Create Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Deployment
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ job.status }}
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack Final Status
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                  "text": "*DEPLOYMENT ${{ job.status }}!*\nSERVER: AZURE TEST SERVER\nRUN BY: *${{ steps.actor.outputs.name }}*${{ steps.prinfo.outputs.merged }}"
                }
              ]
            }

name: Test Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Deployment
        run: |
          echo "Deploying..."
          exit 1   # simulate failure

      - name: Create Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Deployment
        if: always()   # 👈 VERY IMPORTANT
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ job.status }}   # 👈 auto success/failure
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

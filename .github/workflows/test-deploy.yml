name: Test Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    environment: production  # important for GitHub deployment events

    steps:
      - name: Build & Deploy
        run: |
          # (your deployment commands here)

      - name: Notify Deployment (Slack via GitHub)
        run: echo "Deployment done"

      - name: Create Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Deployment
        if: always()   # 👈 VERY IMPORTANT
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ job.status }}   # 👈 auto success/failure
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

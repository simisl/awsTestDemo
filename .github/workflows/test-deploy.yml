name: Test Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # REMOVED 'environment: production' to ensure Repository Secrets are visible

    steps:
      - name: Get current date and time
        id: datetime
        run: echo "now=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Get UNIX timestamp
        id: unixtime
        run: echo "now=$(date +%s)" >> $GITHUB_OUTPUT
    
      - name: Slack Notification - Start
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "Deployment started on AZURE TEST SERVER\nRUN BY: *${{ github.actor && github.actor.toUpperCase() }}*" +
       "${{ github.event.pull_request ? ' (merged from ' + github.event.pull_request.user.login.toUpperCase() + ')' : '' }}" +
       "\nTIME: <!date^${{ steps.unixtime.outputs.now }}^{date_num} {time_secs}|${{ steps.unixtime.outputs.now }}>"
            }
            
      - name: Create Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Deployment
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ job.status }}
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack Final Status
        if: always() # Runs even if deployment fails
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                  "text": "*DEPLOYMENT ${{ job.status && job.status.toUpperCase() }}!* \n" +
                          "SERVER: AZURE TEST SERVER\n" +
                          "RUN BY: *${{ github.actor && github.actor.toUpperCase() }}*" +
                          "${{ github.event.pull_request ? ' (merged from ' + github.event.pull_request.user.login.toUpperCase() + ')' : '' }}"
                }
              ]
            }

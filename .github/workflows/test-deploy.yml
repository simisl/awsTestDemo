name: Test Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # REMOVED 'environment: production' to ensure Repository Secrets are visible

    steps:
      - name: Get current date and time
        id: datetime
        run: echo "now=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
    
      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{secrets.SLACK_CHANNEL_ID}}
        with:
          # This forces the ID directly into the Slack API call
          payload: |
            {
              "channel": "${{secrets.SLACK_CHANNEL_ID}}",
              "text": "Deployment started on AZURE TEST SERVER on ${{ steps.datetime.outputs.now }} by ${{ github.actor }}."
            }
            
      - name: Create Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Deployment
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ job.status }}
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

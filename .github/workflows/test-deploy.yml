name: Test Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get UNIX timestamp
        id: unixtime
        run: echo "now=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Prepare Formatting
        id: format
        run: |
          # Uppercase Actor
          echo "actor_up=$(echo ${{ github.actor }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
          # Handle PR logic
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_USER=$(echo ${{ github.event.pull_request.user.login }} | tr '[:lower:]' '[:upper:]')
            echo "merged= (MERGED FROM $PR_USER)" >> $GITHUB_OUTPUT
          else
            echo "merged=" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification - Start
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "Deployment started on AZURE TEST SERVER\nRUN BY: *${{ steps.format.outputs.actor_up }}*${{ steps.format.outputs.merged }}\nTIME: <!date^${{ steps.unixtime.outputs.now }}^{date_num} {time_secs}|${{ steps.unixtime.outputs.now }}>"
            }
            
      - name: Create Deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finish Deployment
        if: always()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          status: ${{ job.status }}
          env: test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack Final Status
        if: always()
        id: status_format
        run: echo "status_up=$(echo ${{ job.status }} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Send Final Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#36a64f' || '#ff0000' }}",
                  "text": "*DEPLOYMENT ${{ steps.status_format.outputs.status_up }}!*\nSERVER: AZURE TEST SERVER\nRUN BY: *${{ steps.format.outputs.actor_up }}*${{ steps.format.outputs.merged }}"
                }
              ]
            }
